# このフォルダ「単体」を Netlify の Git ルートにしたとき: publish = .
# リポジトリ全体（client-agent）を Netlify に繋いでいるときは、
# リポジトリ直下の netlify.toml が publish = "sunplusone-onefile" を指定します（そちらが優先）。

[build]
  publish = "."

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
